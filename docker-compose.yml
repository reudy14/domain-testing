services:
  pocketbase:
    image: spectado/pocketbase:latest
    container_name: massage-pocketbase
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massage-app
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      POCKETBASE_INTERNAL_URL: http://pocketbase:80
      PUBLIC_POCKETBASE_URL: http://localhost:8090
      ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
